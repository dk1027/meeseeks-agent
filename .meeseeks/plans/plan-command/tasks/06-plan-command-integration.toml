version = 1
id = "WP-1.3.1"
title = "Launch the explorer through the Meeseeks CLI"
description = """
Add `meeseeks plan [PLAN_PATH]` to the existing Typer application and add the bounded Textual runtime dependency. When no path is supplied, discover `.meeseeks/plan.toml` for the current project; when a path is supplied, use it directly. Load and validate the complete execution package before entering the alternate screen, render actionable failures using existing console conventions, and restore the terminal cleanly after normal exit or runtime failure.
"""
out_of_scope = ["Multiple named-plan discovery conventions", "Generating a plan", "Changing or repairing invalid files", "Opening external applications"]

[[acceptance_criteria]]
id = "AC-1"
description = "The plan command is registered in the public CLI and accepts an optional plan path."

[[acceptance_criteria]]
id = "AC-2"
description = "Without an explicit path, the command locates the current project's `.meeseeks/plan.toml`; an explicit path takes precedence."

[[acceptance_criteria]]
id = "AC-3"
description = "Missing, malformed, unsupported, and inconsistent execution packages fail before TUI startup with an actionable message and nonzero exit."

[[acceptance_criteria]]
id = "AC-4"
description = "Normal exit and handled runtime failure restore the terminal, and existing init, draft, verify, help, and version behavior remains intact."

[verification]
commands = ["uv run pytest tests/test_plan_command.py tests/test_cli.py"]

